<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Space Invaders Game</title>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div id="scoreContainer">
      <div>
          <span id="scoreLabel">Score:</span>
          <span id="scoreEl">0</span>
      </div>
      <div>
          <span id="hiScoreLabel">High Score:</span>
          <span id="hiScoreEl">0</span>
      </div>
  </div>
  <canvas id="canvas"></canvas>
  </div>

    <main id="splashScreen" aria-labelledby="gameTitle">
      <div class="splash-stars" aria-hidden="true"></div>
      <section class="splash-content">
        <p class="splash-kicker">Arcade transmission</p>
        <h1 id="gameTitle">Space Invaders</h1>
        <p class="splash-intro">Defend the last line of orbit.</p>

        <div class="instructions" aria-label="Game controls">
          <div class="instruction-row">
            <span class="keycap">A</span>
            <span class="keycap">D</span>
            <span>Move your ship</span>
          </div>
          <div class="instruction-row">
            <span class="keycap keycap-wide">Space</span>
            <span>Fire lasers</span>
          </div>
        </div>

        <button id="startButton" type="button">Begin Mission</button>
      </section>
    </main>

    <!-- Game Over Modal -->
    <div id="gameOverModal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
       
        <div id="gameOverModal">
          <h2>Game Over!</h2>
          <p>Your Score: <span id="finalScore"></span></p>
          <button id="closeButton">Close</button>
          <button id="restartButton">Restart</button>
        </div>
      </div>
    </div>

    <script src="./index.js"></script>
  </body>
</html>
